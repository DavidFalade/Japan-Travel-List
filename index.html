/* ─── CHECKITEM ─────────────────────────────────────────── */
function CheckItem({text}){
  const [c,setC]=useState(false);
  return(
    <div onClick={()=>setC(!c)} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:"1px solid #f5f5f5",cursor:"pointer",opacity:c?0.38:1,transition:"opacity 0.2s"}}>

      </div>

  );
}

/* ─── BUDGET TRACKER ────────────────────────────────────── */
function Budget(){
  const LS_KEY="jp_exp_v2";
  const load=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch{return[]}};
  const [exps,setExps]=useState(load);
  const [form,setForm]=useState({amt:"",cat:"food",note:""});
  const [add,setAdd]=useState(false);

  const save=e=>{setExps(e);try{localStorage.setItem(LS_KEY,JSON.stringify(e))}catch{}};
  const submit=()=>{
    const v=parseFloat(form.amt);
    if(!v||isNaN(v))return;
    save([...exps,{id:Date.now(),amt:v,cat:form.cat,note:form.note,d:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}]);
    setForm({amt:"",cat:"food",note:""});setAdd(false);
  };
  const del=id=>save(exps.filter(e=>e.id!==id));

  const totals=CATS.reduce((a,c)=>{a[c.key]=exps.filter(e=>e.cat===c.key).reduce((s,e)=>s+e.amt,0);return a},{});
  const grandSpent=exps.reduce((s,e)=>s+e.amt,0);
  const grandBudget=CATS.reduce((s,c)=>s+c.budget,0);

  return(
    <div>
      {/* Confirmed housing */}
      <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>🏨 Confirmed Housing Costs</div>
        {HOUSING.map((h,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"6px 0",borderBottom:"1px solid #f5f5f5"}}>
            <div>
              <div style={{fontSize:13,fontWeight:600}}>{h.city}</div>
              <div style={{fontSize:11,color:MUTED}}>{h.dates}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
              <div style={{fontSize:13,fontWeight:700,color:h.total==="TBD"?"#E67E22":INK}}>{h.total==="TBD"?"TBD":`$${typeof h.total==="number"?h.total.toFixed(2):h.total}`}</div>
              <div style={{fontSize:10,color:MUTED}}>{h.status}</div>
            </div>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:10,paddingTop:8,borderTop:`2px solid ${INK}`}}>
          <div style={{fontWeight:700,fontSize:14}}>Total Housing (group)</div>
          <div style={{fontWeight:700,fontSize:14}}>~$3,141</div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
          <div style={{fontSize:12,color:MUTED}}>Per person (~3 people)</div>
          <div style={{fontSize:12,color:MUTED}}>~$1,047</div>
        </div>
      </div>

      {/* Per-person estimate */}
      <div style={{background:"#FFF8F0",border:"1px solid #E67E22",borderRadius:12,padding:14,marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>💰 Per Person Budget Estimate</div>
        {[
          {l:"Plane ticket",v:"~$780",n:"already bought"},
          {l:"Housing",v:"~$1,047",n:"from bookings above"},
          {l:"JR Pass + local transit",v:"~$400"},
          {l:"Food",v:"~$650",n:"~$30/day"},
          {l:"Events & activities",v:"~$700"},
          {l:"eSIM (Airalo)",v:"$74",n:"you have it"},
          {l:"Shopping",v:"variable",n:"your call"},
        ].map((r,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f0e8dc",fontSize:13}}>
            <div><span>{r.l}</span>{r.n&&<span style={{fontSize:11,color:MUTED,marginLeft:6}}>{r.n}</span>}</div>
            <div style={{fontWeight:600,flexShrink:0,marginLeft:8}}>{r.v}</div>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:10,paddingTop:8,borderTop:"2px solid #E67E22",fontSize:15,fontWeight:700}}>
          <div>Est. Total (excl. shopping)</div>
          <div>~$3,651</div>
        </div>
        <div style={{fontSize:11,color:MUTED,marginTop:4}}>Exchange rate: $1 = ¥156</div>
      </div>

      {/* Tracker */}
      <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:15}}>📊 Expense Tracker</div>
          <button onClick={()=>setAdd(!add)} style={{background:RED,color:"#fff",border:"none",borderRadius:20,padding:"6px 14px",fontSize:13,cursor:"pointer"}}>+ Add</button>
        </div>

        {add&&(
          <div style={{background:"#f9f9f9",borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Amount (USD)</div>
              <input value={form.amt} onChange={e=>setForm({...form,amt:e.target.value})} placeholder="25"
                style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}/>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Category</div>
              <select value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}
                style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}>
                {CATS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
              </select>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Note</div>
              <input value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="Ramen at Ichiran"
                style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={submit} style={{flex:1,background:RED,color:"#fff",border:"none",borderRadius:8,padding:10,fontSize:14,cursor:"pointer",fontFamily:"Georgia,serif"}}>Add</button>
              <button onClick={()=>setAdd(false)} style={{flex:1,background:"#eee",color:INK,border:"none",borderRadius:8,padding:10,fontSize:14,cursor:"pointer",fontFamily:"Georgia,serif"}}>Cancel</button>
            </div>
          </div>
        )}

        {CATS.map(cat=>{
          const spent=totals[cat.key]||0;
          const pct=Math.min((spent/cat.budget)*100,100);
          const over=spent>cat.budget;
          return(
            <div key={cat.key} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                <span style={{fontWeight:600}}>{cat.label}</span>
                <span style={{color:over?RED:MUTED}}>${spent.toFixed(0)} / ${cat.budget}</span>
              </div>
              <div style={{background:"#f0f0f0",borderRadius:10,height:8,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:over?RED:cat.color,borderRadius:10,transition:"width 0.3s"}}/>
              </div>
            </div>
          );
        })}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:`2px solid ${INK}`,fontSize:15,fontWeight:700}}>
          <div>Total tracked</div>
          <div style={{color:grandSpent>grandBudget?RED:INK}}>${grandSpent.toFixed(0)} / ${grandBudget}</div>
        </div>
      </div>

      {/* Recent */}
      {exps.length>0&&(
        <div style={{background:"#fff",borderRadius:12,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>Recent Expenses</div>
          {[...exps].reverse().map(e=>{
            const cat=CATS.find(c=>c.key===e.cat);
            return(
              <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f5f5f5"}}>
                <div style={{width:32,height:32,borderRadius:8,background:cat?.color+"20",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16}}>{cat?.label.split(" ")[0]}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600}}>{e.note||cat?.label}</div>
                  <div style={{fontSize:11,color:MUTED}}>{e.d}</div>
                </div>
                <div style={{fontWeight:700,fontSize:14}}>${e.amt.toFixed(2)}</div>
                <button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:18,padding:"0 2px",lineHeight:1}}>×</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

            {/* Still to book */}
            <div style={{background:"#FFF3F3",border:`1.5px solid ${RED}`,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
              <div style={{fontWeight:700,color:RED,fontSize:14}}>⚠️ Still Need to Book</div>
            </div>
            {TODO_BOOK.map((b,i)=>{
              const uc={BOOK_TODAY:RED,CONFIRM:"#E67E22",CHECK_NOW:"#D4A017",BOOK_AHEAD:"#9B6B4A",OPTIONAL:"#aaa"}
              const col=b.urgency==="BOOK TODAY"?RED:b.urgency==="CONFIRM"?"#E67E22":b.urgency==="CHECK NOW"?"#D4A017":b.urgency==="BOOK AHEAD"?"#9B6B4A":"#aaa";
              return(
                <div key={i} style={{background:"#fff",borderRadius:12,padding:13,marginBottom:7,boxShadow:"0 2px 8px rgba(0,0,0,.06)",borderLeft:`4px solid ${col}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:7}}>
                    <div style={{fontWeight:700,fontSize:13}}>{b.item}</div>
                    <span style={{fontSize:8.5,fontFamily:"monospace",letterSpacing:0.8,flexShrink:0,padding:"3px 7px",borderRadius:10,background:col,color:b.urgency==="CHECK NOW"?INK:"#fff",textTransform:"uppercase"}}>{b.urgency}</span>
                  </div>
                  <div style={{fontSize:12,color:"#888",marginTop:3}}>{b.note}</div>
                  <div style={{fontSize:11.5,color:"#5B7FA6",marginTop:5,fontFamily:"monospace"}}>→ {b.url}</div>
                </div>
              );
            })}

            {/* Apps */}
            <div style={{background:"#fff",borderRadius:12,padding:14,marginTop:6,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>📱 Apps</div>
              <div style={{fontSize:10,color:MUTED,marginBottom:8,fontFamily:"monospace",letterSpacing:1}}>✅ YOU HAVE THESE</div>
              {APPS.filter(a=>a.have).map((a,i)=>(
                <div key={i} style={{display:"flex",gap:9,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{fontSize:17,flexShrink:0}}>{a.icon}</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:"#4A7C6B"}}>{a.name}</div>
                    <div style={{fontSize:11.5,color:"#666"}}>{a.note}</div>
                  </div>
                </div>
              ))}
              <div style={{fontSize:10,color:MUTED,marginTop:12,marginBottom:8,fontFamily:"monospace",letterSpacing:1}}>📥 GET THESE TOO</div>
              {APPS.filter(a=>!a.have).map((a,i)=>(
                <div key={i} style={{display:"flex",gap:9,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{fontSize:17,flexShrink:0}}>{a.icon}</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:700}}>{a.name}</div>
                    <div style={{fontSize:11.5,color:"#666"}}>{a.note}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Pre-departure checklist */}
            <div style={{background:"#F0F7FF",borderRadius:12,padding:14,marginTop:10}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📋 Before You Leave Checklist</div>
              {[
                "Fill out Japan Visit Web (vjw.digital.go.jp) — customs form",
                "Activate Airalo eSIM on plane or at landing",
                "Load Suica card via Apple Wallet",
                "Download Google Maps offline for Japan",
                "Download Google Translate Japanese offline pack",
                "Notify your bank of Japan travel dates",
                "Get ¥30,000 cash (~$200) from bank before departing",
                "Reserve Shinkansen seats via smartEX app",
                "Screenshot all hotel booking confirmation numbers",
                "Check Klook app — confirm all 3 booked events + Hozugawa",
                "Book teamLab Biortex Kyoto at teamlab.art",
                "Book Kawaguchiko bus at highway-buses.jp",
                "Pack ibuprofen and any OTC meds",
                "Bring portable power banks",
                "Bring comfortable walking shoes — you'll walk 20,000+ steps/day",
              ].map((item,i)=><CheckItem key={i} text={item}/>)}
            </div>
          </div>
        )}

        {/* ──── SHOP ──── */}
        {tab==="shop"&&(
          <div>
            <div style={{background:"#FFF8F0",borderRadius:10,padding:"10px 13px",marginBottom:9,fontSize:12.5,color:"#8B4513"}}>
              💡 Tap items to check them off as you buy
            </div>
            {SHOPPING.map((cat,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:12,padding:13,marginBottom:9,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:9}}>{cat.cat}</div>
                {cat.items.map((item,j)=><CheckItem key={j} text={item}/>)}
              </div>
            ))}
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    const sw=`const C="jp-v3";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.addAll(["/"]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
    const b=new Blob([sw],{type:"application/javascript"});
    navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});
  });
}
</script>
</body>
</html>
