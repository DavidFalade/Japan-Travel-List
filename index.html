function CheckItem({text,prefix="misc"}){
  const key=`${CHECKS_KEY}:${prefix}:${text}`;
  const [c,setC]=useState(()=>ls.get(key,false));
  const toggle=()=>{const n=!c;setC(n);ls.set(key,n);};
  return(
    <div onClick={toggle} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:"1px solid #f5f5f5",cursor:"pointer",opacity:c?0.38:1,transition:"opacity 0.2s"}}>
      <div style={{width:20,height:20,borderRadius:4,border:`2px solid ${c?RED:"#ccc"}`,background:c?RED:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.15s"}}>
        {c&&<span style={{color:"#fff",fontSize:13,lineHeight:1}}>✓</span>}
      </div>
      <span style={{fontSize:13,textDecoration:c?"line-through":"none",color:"#333"}}>{text}</span>
    </div>
  );
}

function EventsTab(){
  const EV_KEY="jp_events_v2";
  const [events,setEvents]=useState(()=>ls.get(EV_KEY,DEFAULT_EVENTS));
  const [activeCity,setActiveCity]=useState("tokyo");
  const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({name:"",type:"sightseeing",status:"todo",note:""});
  const [editId,setEditId]=useState(null);

  const save=ev=>{setEvents(ev);ls.set(EV_KEY,ev);};

  const addEvent=()=>{
    if(!form.name.trim())return;
    const cityEvs=events[activeCity]||[];
    if(editId){
      save({...events,[activeCity]:cityEvs.map(e=>e.id===editId?{...e,...form}:e)});
      setEditId(null);
    } else {
      const id=activeCity[0]+Date.now();
      save({...events,[activeCity]:[...cityEvs,{id,...form}]});
    }
    setForm({name:"",type:"sightseeing",status:"todo",note:""});
    setShowAdd(false);
  };

  const deleteEvent=(city,id)=>save({...events,[city]:(events[city]||[]).filter(e=>e.id!==id)});

  const cycleStatus=(city,id)=>{
    const order=["todo","booked","done","skip"];
    save({...events,[city]:(events[city]||[]).map(e=>{
      if(e.id!==id)return e;
      const next=order[(order.indexOf(e.status)+1)%order.length];
      return{...e,status:next};
    })});
  };

  const startEdit=(e)=>{
    setForm({name:e.name,type:e.type,status:e.status,note:e.note||""});
    setEditId(e.id);setShowAdd(true);
  };

  const cityData=CITY_LABELS[activeCity];
  const cityEvents=events[activeCity]||[];
  const counts=Object.fromEntries(Object.entries(events).map(([k,v])=>[k,{total:v.length,booked:v.filter(e=>e.status==="booked").length,done:v.filter(e=>e.status==="done").length}]));

  return(
    <div>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:10}}>
        {Object.entries(CITY_LABELS).map(([k,v])=>(
          <button key={k} onClick={()=>{setActiveCity(k);setShowAdd(false);}} className="ns" style={{flexShrink:0,padding:"7px 12px",borderRadius:20,border:"none",cursor:"pointer",background:activeCity===k?v.color:"#fff",color:activeCity===k?"#fff":INK,fontSize:12,fontWeight:600,boxShadow:"0 1px 4px rgba(0,0,0,.08)",transition:"all 0.2s"}}>
            {v.emoji} {v.label}
            <span style={{fontSize:10,opacity:0.8,marginLeft:5}}>{counts[k]?.total||0}</span>
          </button>
        ))}
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>{cityData.emoji} {cityData.label}</div>
          <div style={{fontSize:11,color:MUTED}}>
            {cityEvents.length} events ·{" "}
            <span style={{color:"#2e7d32"}}>{counts[activeCity]?.booked||0} booked</span> ·{" "}
            <span style={{color:"#1565c0"}}>{counts[activeCity]?.done||0} done</span>
          </div>
        </div>
        <button onClick={()=>{setShowAdd(!showAdd);setEditId(null);setForm({name:"",type:"sightseeing",status:"todo",note:""}); }} style={{background:RED,color:"#fff",border:"none",borderRadius:20,padding:"7px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>
          {showAdd?"Cancel":"+ Add"}
        </button>
      </div>

      {showAdd&&(
        <div style={{background:"#fff",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 2px 12px rgba(0,0,0,.1)",border:`1.5px solid ${RED}30`}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:RED}}>{editId?"Edit Event":"New Event — "+cityData.label}</div>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Event / Activity Name</div>
            <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Robot Restaurant, teamLab..."
              style={{width:"100%",padding:"9px 11px",border:"1.5px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}/>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Type</div>
              <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}
                style={{width:"100%",padding:"9px 11px",border:"1.5px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                {EVENT_TYPES.map(t=><option key={t} value={t}>{TYPE_ICONS[t]} {t}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Status</div>
              <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}
                style={{width:"100%",padding:"9px 11px",border:"1.5px solid #ddd",borderRadius:8,fontSize:14,background:"#fff"}}>
                {Object.entries(STATUS_STYLES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:MUTED,marginBottom:4}}>Notes (optional)</div>
            <textarea value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="address, booking link, tips..."
              rows={2} style={{width:"100%",padding:"9px 11px",border:"1.5px solid #ddd",borderRadius:8,fontSize:13,background:"#fff",resize:"none"}}/>
          </div>
          <button onClick={addEvent} style={{width:"100%",background:RED,color:"#fff",border:"none",borderRadius:8,padding:"11px",fontSize:14,cursor:"pointer",fontFamily:"Georgia,serif",fontWeight:600}}>
            {editId?"Save Changes":"Add to "+cityData.label}
          </button>
        </div>
      )}

      <div style={{display:"flex",gap:5,marginBottom:10,overflowX:"auto",paddingBottom:2}}>
        {Object.entries(STATUS_STYLES).map(([k,v])=>{
          const count=cityEvents.filter(e=>e.status===k).length;
          if(count===0)return null;
          return(
            <div key={k} style={{flexShrink:0,padding:"4px 10px",borderRadius:12,background:v.bg,color:v.color,fontSize:11,fontWeight:600}}>
              {v.label} ({count})
            </div>
          );
        })}
      </div>

      {cityEvents.length===0&&(
        <div style={{textAlign:"center",padding:"40px 20px",color:MUTED}}>
          <div style={{fontSize:32,marginBottom:8}}>✨</div>
          <div style={{fontSize:14}}>No events yet for {cityData.label}</div>
          <div style={{fontSize:12,marginTop:4}}>Tap + Add to add your first one</div>
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {cityEvents.map(ev=>{
          const ss=STATUS_STYLES[ev.status]||STATUS_STYLES.todo;
          return(
            <div key={ev.id} style={{background:"#fff",borderRadius:12,padding:"12px 13px",boxShadow:"0 1px 6px rgba(0,0,0,.06)",borderLeft:`3px solid ${CITY_LABELS[activeCity].color}`,opacity:ev.status==="skip"?0.45:1}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                <span style={{fontSize:16,flexShrink:0,marginTop:1}}>{TYPE_ICONS[ev.type]||"📍"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,marginBottom:ev.note?3:0}}>{ev.name}</div>
                  {ev.note&&<div style={{fontSize:11.5,color:"#666",fontStyle:"italic"}}>{ev.note}</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0,marginLeft:6}}>
                  <button onClick={()=>cycleStatus(activeCity,ev.id)} style={{padding:"3px 8px",borderRadius:10,border:"none",cursor:"pointer",background:ss.bg,color:ss.color,fontSize:10,fontWeight:700,fontFamily:"monospace",whiteSpace:"nowrap"}}>
                    {ss.label}
                  </button>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>startEdit(ev)} style={{background:"none",border:"none",color:"#aaa",cursor:"pointer",fontSize:14,padding:0}}>✏️</button>
                    <button onClick={()=>deleteEvent(activeCity,ev.id)} style={{background:"none",border:"none",color:"#ddd",cursor:"pointer",fontSize:16,padding:0,lineHeight:1}}>×</button>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{background:"#f9f9f9",borderRadius:10,padding:"10px 13px",marginTop:12}}>
        <div style={{fontSize:10,color:MUTED,fontFamily:"monospace",letterSpacing:1,marginBottom:6}}>TAP STATUS TO CYCLE</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {Object.entries(STATUS_STYLES).map(([k,v])=>(
            <div key={k} style={{padding:"3px 9px",borderRadius:10,background:v.bg,color:v.color,fontSize:11,fontWeight:600}}>{v.label}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:15}}>📊 Expense Tracker</div>
          <button onClick={()=>setAdd(!add)} style={{background:RED,color:"#fff",border:"none",borderRadius:20,padding:"6px 14px",fontSize:13,cursor:"pointer"}}>+ Add</button>
        </div>
        {add&&(
          <div style={{background:"#f9f9f9",borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{marginBottom:8}}><div style={{fontSize:11,color:MUTED,marginBottom:4}}>Amount (USD)</div>
              <input value={form.amt} onChange={e=>setForm({...form,amt:e.target.value})} placeholder="25" style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}/></div>
            <div style={{marginBottom:8}}><div style={{fontSize:11,color:MUTED,marginBottom:4}}>Category</div>
              <select value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})} style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}>
                {CATS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}</select></div>
            <div style={{marginBottom:10}}><div style={{fontSize:11,color:MUTED,marginBottom:4}}>Note</div>
              <input value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="Ramen at Ichiran" style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:14,background:"#fff"}}/></div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={submit} style={{flex:1,background:RED,color:"#fff",border:"none",borderRadius:8,padding:10,fontSize:14,cursor:"pointer",fontFamily:"Georgia,serif"}}>Add</button>
              <button onClick={()=>setAdd(false)} style={{flex:1,background:"#eee",color:INK,border:"none",borderRadius:8,padding:10,fontSize:14,cursor:"pointer",fontFamily:"Georgia,serif"}}>Cancel</button>
            </div>
          </div>
        )}
        {CATS.map(cat=>{const spent=totals[cat.key]||0;const pct=Math.min((spent/cat.budget)*100,100);const over=spent>cat.budget;return(
          <div key={cat.key} style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
              <span style={{fontWeight:600}}>{cat.label}</span>
              <span style={{color:over?RED:MUTED}}>${spent.toFixed(0)} / ${cat.budget}</span>
            </div>
            <div style={{background:"#f0f0f0",borderRadius:10,height:8,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:over?RED:cat.color,borderRadius:10,transition:"width 0.3s"}}/>
            </div>
          </div>
        );})}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:`2px solid ${INK}`,fontSize:15,fontWeight:700}}>
          <div>Total tracked</div><div style={{color:grandSpent>grandBudget?RED:INK}}>${grandSpent.toFixed(0)} / ${grandBudget}</div>
        </div>
      </div>
      {exps.length>0&&(
        <div style={{background:"#fff",borderRadius:12,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>Recent Expenses</div>
          {[...exps].reverse().map(e=>{const cat=CATS.find(c=>c.key===e.cat);return(
            <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f5f5f5"}}>
              <div style={{width:32,height:32,borderRadius:8,background:(cat?.color||"#888")+"20",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:15}}>{cat?.label.split(" ")[0]}</div>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{e.note||cat?.label}</div><div style={{fontSize:11,color:MUTED}}>{e.d}</div></div>
              <div style={{fontWeight:700,fontSize:14}}>${e.amt.toFixed(2)}</div>
              <button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:18,padding:"0 2px",lineHeight:1}}>×</button>
            </div>
          );})}
        </div>
      )}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("days");
  const [open,setOpen]=useState(-1);
  const toggle=useCallback(i=>setOpen(p=>p===i?-1:i),[]);
  const TABS=[{k:"days",l:"📅 Days"},{k:"events",l:"🗾 Events"},{k:"budget",l:"💰 Budget"},{k:"book",l:"⚠️ Book"},{k:"shop",l:"🛍️ Shop"}];

  return(
    <div style={{background:CREAM,minHeight:"100vh",paddingBottom:50}}>
      <div style={{background:INK,color:CREAM,padding:"0 1.25rem 0.75rem",paddingTop:"max(1.5rem,env(safe-area-inset-top))",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,right:0,width:150,height:150,borderRadius:"50%",background:RED,opacity:0.15,transform:"translate(50px,-50px)"}}/>
        <div style={{fontSize:9,letterSpacing:4,color:MUTED,marginBottom:5,fontFamily:"monospace"}}>MAY 14 – JUNE 3 · 3 WEEKS</div>
        <h1 style={{margin:0,fontSize:"1.7rem",fontWeight:700}}>Japan 🇯🇵</h1>
        <p style={{margin:"3px 0 0",color:"#aaa",fontSize:11}}>Tokyo · Fuji · Kyoto · Osaka · Nara · Okinawa · Zamami</p>
      </div>

      <div style={{position:"sticky",top:0,zIndex:100,background:INK,padding:"0.5rem 0.75rem 0.6rem"}}>
        <div className="tab-scroll">
          {TABS.map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)} className="ns" style={{flexShrink:0,padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontFamily:"monospace",fontSize:10,letterSpacing:0.5,background:tab===t.k?RED:"rgba(255,255,255,0.1)",color:tab===t.k?"#fff":"#aaa",transition:"all 0.2s",whiteSpace:"nowrap"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"0.65rem"}}>
        {tab==="days"&&DAYS.map((day,i)=>(
          <div key={i} style={{marginBottom:7}}>
            <button onClick={()=>toggle(i)} className="ns" style={{width:"100%",background:open===i?INK:"#fff",color:open===i?CREAM:INK,border:"none",borderRadius:open===i?"12px 12px 0 0":12,padding:"11px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:9,textAlign:"left",boxShadow:"0 2px 8px rgba(0,0,0,.06)",transition:"all 0.2s"}}>
              <span style={{fontSize:18}}>{day.emoji}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:9.5,fontFamily:"monospace",color:open===i?"#aaa":MUTED}}>{day.date}</div>
                <div style={{fontWeight:700,fontSize:13,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{day.loc}</div>
              </div>
              <span style={{fontSize:8.5,fontFamily:"monospace",letterSpacing:0.8,flexShrink:0,padding:"3px 7px",borderRadius:10,background:day.tagColor,color:"#fff",textTransform:"uppercase"}}>{day.tag}</span>
              <span style={{fontSize:11,opacity:0.45,flexShrink:0}}>{open===i?"▲":"▼"}</span>
            </button>
            {open===i&&(
              <div style={{background:"#fff",borderRadius:"0 0 12px 12px",padding:"13px 13px 16px",boxShadow:"0 4px 12px rgba(0,0,0,.07)"}}>
                {day.stay&&<div style={{background:"#F0F7FF",borderRadius:8,padding:"7px 11px",marginBottom:11,fontSize:11.5,color:"#5B7FA6"}}>🏨 {day.stay}</div>}
                {day.acts.map((a,j)=>(
                  <div key={j} style={{display:"flex",gap:9,paddingBottom:9,borderBottom:j<day.acts.length-1?"1px solid #f2f2f2":"none",marginBottom:9}}>
                    <span style={{fontSize:13,marginTop:1,minWidth:17}}>{TYPE_ICONS[a.t]||"•"}</span>
                    <div><div style={{fontSize:13,fontWeight:600}}>{a.n}</div>{a.note&&<div style={{fontSize:11.5,color:"#666",marginTop:2,fontStyle:"italic"}}>{a.note}</div>}</div>
                  </div>
                ))}
                {day.book?.length>0&&(
                  <div style={{background:"#FFF3F3",border:`1px solid ${RED}30`,borderRadius:8,padding:"9px 11px",marginBottom:9}}>
                    <div style={{fontSize:9.5,fontWeight:700,color:RED,letterSpacing:1,marginBottom:5,fontFamily:"monospace"}}>⚠️ BOOK IN ADVANCE</div>
                    {day.book.map((b,k)=><div key={k} style={{fontSize:12.5,color:"#c00",marginBottom:2}}>• {b}</div>)}
                  </div>
                )}
                {day.shop?.length>0&&(
                  <div style={{background:"#F5F3FF",borderRadius:8,padding:"9px 11px",marginBottom:9}}>
                    <div style={{fontSize:9.5,fontWeight:700,color:"#7B6FA3",letterSpacing:1,marginBottom:5,fontFamily:"monospace"}}>🛍️ BUY HERE</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {day.shop.map((s,k)=><span key={k} style={{background:"#EDE8FF",borderRadius:12,padding:"3px 9px",fontSize:11.5,color:"#5040A0"}}>{s}</span>)}
                    </div>
                  </div>
                )}
                {day.char&&(
                  <div style={{background:"#FFF8F0",borderRadius:8,padding:"9px 11px",marginBottom:9}}>
                    <div style={{fontSize:9.5,fontWeight:700,color:"#B56B30",letterSpacing:1,marginBottom:7,fontFamily:"monospace"}}>🎪 CHARACTER STREET</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {day.char.map((s,k)=><span key={k} style={{background:s.includes("⚠️")?"#FFE8E8":"#FFEFD9",borderRadius:12,padding:"3px 9px",fontSize:11.5,color:s.includes("⚠️")?RED:"#8B4513"}}>{s}</span>)}
                    </div>
                  </div>
                )}
                {day.tips?.length>0&&(
                  <div style={{borderTop:"1px solid #f0f0f0",paddingTop:9}}>
                    <div style={{fontSize:9.5,fontWeight:700,color:"#4A7C6B",letterSpacing:1,marginBottom:5,fontFamily:"monospace"}}>💡 PRO TIPS</div>
                    {day.tips.map((t,k)=><div key={k} style={{fontSize:11.5,color:"#444",marginBottom:3}}>↗ {t}</div>)}
                  </div>
                )}
              </div>
            )}
          </div>
        ))}

        {tab==="events"&&<EventsTab/>}
        {tab==="budget"&&<Budget/>}

        {tab==="book"&&(
          <div>
            <div style={{background:"#F0FFF4",border:"1.5px solid #4A7C6B",borderRadius:12,padding:14,marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:14,color:"#4A7C6B",marginBottom:9}}>✅ Already Confirmed</div>
              {CONFIRMED.map((b,i)=>(
                <div key={i} style={{padding:"7px 0",borderBottom:i<CONFIRMED.length-1?"1px solid #cce8d4":"none"}}>
                  <div style={{fontSize:13,fontWeight:600}}>{b.name}</div>
                  <div style={{fontSize:11.5,color:"#555",marginTop:2}}>{b.note}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#FFF3F3",border:`1.5px solid ${RED}`,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
              <div style={{fontWeight:700,color:RED,fontSize:14}}>⚠️ Still Need to Book</div>
            </div>
            {TODO_BOOK.map((b,i)=>{
              const col=b.urgency==="BOOK TODAY"?RED:b.urgency==="CONFIRM"?"#E67E22":b.urgency==="CHECK NOW"?"#D4A017":b.urgency==="BOOK AHEAD"?"#9B6B4A":"#aaa";
              return(
                <div key={i} style={{background:"#fff",borderRadius:12,padding:13,marginBottom:7,boxShadow:"0 2px 8px rgba(0,0,0,.06)",borderLeft:`4px solid ${col}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:7}}>
                    <div style={{fontWeight:700,fontSize:13}}>{b.item}</div>
                    <span style={{fontSize:8.5,fontFamily:"monospace",letterSpacing:0.8,flexShrink:0,padding:"3px 7px",borderRadius:10,background:col,color:b.urgency==="CHECK NOW"?INK:"#fff",textTransform:"uppercase"}}>{b.urgency}</span>
                  </div>
                  <div style={{fontSize:12,color:"#888",marginTop:3}}>{b.note}</div>
                  <div style={{fontSize:11.5,color:"#5B7FA6",marginTop:5,fontFamily:"monospace"}}>→ {b.url}</div>
                </div>
              );
            })}
            <div style={{background:"#fff",borderRadius:12,padding:14,marginTop:8,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>📱 Apps</div>
              <div style={{fontSize:10,color:MUTED,marginBottom:8,fontFamily:"monospace",letterSpacing:1}}>✅ YOU HAVE THESE</div>
              {APPS.filter(a=>a.have).map((a,i)=>(
                <div key={i} style={{display:"flex",gap:9,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{fontSize:17,flexShrink:0}}>{a.icon}</span>
                  <div><div style={{fontSize:13,fontWeight:700,color:"#4A7C6B"}}>{a.name}</div><div style={{fontSize:11.5,color:"#666"}}>{a.note}</div></div>
                </div>
              ))}
              <div style={{fontSize:10,color:MUTED,marginTop:12,marginBottom:8,fontFamily:"monospace",letterSpacing:1}}>📥 GET THESE TOO</div>
              {APPS.filter(a=>!a.have).map((a,i)=>(
                <div key={i} style={{display:"flex",gap:9,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{fontSize:17,flexShrink:0}}>{a.icon}</span>
                  <div><div style={{fontSize:13,fontWeight:700}}>{a.name}</div><div style={{fontSize:11.5,color:"#666"}}>{a.note}</div></div>
                </div>
              ))}
            </div>
            <div style={{background:"#F0F7FF",borderRadius:12,padding:14,marginTop:10}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📋 Before You Leave</div>
              {["Fill out Japan Visit Web (vjw.digital.go.jp)","Activate Airalo eSIM on the plane","Load Suica via Apple Wallet","Download Google Maps offline for Japan","Download Google Translate Japanese offline","Notify bank of travel dates","Get ¥30,000 cash (~$200) from bank","Reserve Shinkansen seats in smartEX app","Screenshot all hotel confirmation numbers","Check Klook — confirm all 3 events + Hozugawa","Book teamLab Biortex at teamlab.art","Book Kawaguchiko bus at highway-buses.jp","Pack ibuprofen","Bring portable power banks","Bring comfortable walking shoes (20k steps/day)"].map((item)=>(
                <CheckItem key={item} text={item} prefix="preflight"/>
              ))}
            </div>
          </div>
        )}

        {tab==="shop"&&(
          <div>
            <div style={{background:"#FFF8F0",borderRadius:10,padding:"10px 13px",marginBottom:9,fontSize:12.5,color:"#8B4513"}}>
              💡 Tap items to check off — stays checked even when you close the app
            </div>
            {SHOPPING_CATS.map((cat,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:12,padding:13,marginBottom:9,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:9}}>{cat.cat}</div>
                {cat.items.map(item=><CheckItem key={item} text={item} prefix={`shop_${i}`}/>)}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker"in navigator){
  window.addEventListener("load",()=>{
    const sw=`const C="jp-v4";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.addAll(["/"]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
  });
}
</script>
